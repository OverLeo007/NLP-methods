name: Java

on:
  push:
    paths: ['java/**', '.github/workflows/java.yml']
  pull_request:
    paths: ['java/**', '.github/workflows/java.yml']

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: java
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Сборка и проверка форматирования
        run: bash ./gradlew build spotlessCheck
