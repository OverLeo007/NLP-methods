[versions]
spring-boot = "4.0.8"
picocli = "4.7.7"
lombok = "1.18.42"
lombok-plugin = "9.8.0"
spotless = "8.10.4"
eclipse-jdt = "4.40"
dl4j = "1.0.0-M2.1"
lucene = "10.3.1"
openblas = "0.3.19-1.5.7"
javacpp = "1.5.7"

[libraries]
dl4j-nlp = { module = "org.deeplearning4j:deeplearning4j-nlp", version.ref = "dl4j" }
nd4j-native = { module = "org.nd4j:nd4j-native", version.ref = "dl4j" }
openblas = { module = "org.bytedeco:openblas", version.ref = "openblas" }
javacpp = { module = "org.bytedeco:javacpp", version.ref = "javacpp" }
lucene-analysis-common = { module = "org.apache.lucene:lucene-analysis-common", version.ref = "lucene" }
